name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main]
    types:
      - completed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Solo corre si el workflow de CI terminó exitosamente en main
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image tag
        id: meta
        run: echo "tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Environment con regla de protección configurada manualmente en GitHub
    # (Settings → Environments → production → Required reviewers)
    environment:
      name: production
      url: ${{ steps.deploy.outputs.site_url }}
    steps:
      - name: Deploy to hosting provider
        id: deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "⚠️ DEPLOY_HOOK_URL no configurado todavía. Agregalo en Settings → Secrets → Actions."
            echo "site_url=https://pendiente-de-configurar.example.com" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
          echo "site_url=https://todo-api-cicd.onrender.com" >> "$GITHUB_OUTPUT"

      - name: Confirm deployment
        run: echo "🚀 Imagen ${{ needs.build-and-push.outputs.image-tag }} desplegada a producción."
